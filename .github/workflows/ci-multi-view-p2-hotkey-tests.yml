# THROWAWAY, never merge. Runs the Dart tests for the input broadcast slice 4
# branch on the Pombikz fork, whose inherited workflows are disabled.
name: Input broadcast slice 4 Dart tests

on:
  workflow_dispatch:
  push:
    branches:
      - ci/multi-view-p2-hotkey-tests

env:
  FLUTTER_VERSION: "3.24.5"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  dart-tests:
    needs: [generate-bridge]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Run the shortcut model test
        working-directory: flutter
        run: flutter test --timeout 60s test/shortcut_model_test.dart

      - name: Run all Dart tests
        if: ${{ always() }}
        working-directory: flutter
        run: flutter test --timeout 60s
